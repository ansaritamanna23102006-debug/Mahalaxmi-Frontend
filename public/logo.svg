<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="100%" height="100%">
  <defs>
    <!-- Premium Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE5B4" />
      <stop offset="50%" stop-color="#D9A441" />
      <stop offset="100%" stop-color="#A67C1E" />
    </linearGradient>
    <!-- Deep Maroon Gradient -->
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9E2A2B" />
      <stop offset="100%" stop-color="#540B0C" />
    </linearGradient>
  </defs>

  <!-- Left: Traditional Lotus Mandala Emblem -->
  <g transform="translate(40, 40)">
    <!-- Outer Decorative Dotted Ring -->
    <circle r="34" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="3 3" />
    <!-- Inner Solid Ring -->
    <circle r="30" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
    <!-- Maroon Emblem Base -->
    <circle r="28" fill="url(#maroonGrad)" />
    
    <!-- Mandala Lotus Flower -->
    <g transform="scale(0.8)">
      <!-- Center Lotus Petal -->
      <path d="M 0,-18 C 3,-10 3,0 0,5 C -3,0 -3,-10 0,-18 Z" fill="url(#goldGrad)" />
      <!-- Left Inner Petal -->
      <path d="M 0,-18 C -8,-12 -12,0 -5,5 C -1,5 -1,0 0,-18 Z" fill="url(#goldGrad)" opacity="0.9" />
      <!-- Right Inner Petal -->
      <path d="M 0,-18 C 8,-12 12,0 5,5 C 1,5 1,0 0,-18 Z" fill="url(#goldGrad)" opacity="0.9" />
      <!-- Left Outer Petal -->
      <path d="M 0,-10 C -15,-5 -18,10 -10,12 C -5,12 -5,5 0,-10 Z" fill="url(#goldGrad)" opacity="0.8" />
      <!-- Right Outer Petal -->
      <path d="M 0,-10 C 15,-5 18,10 10,12 C 5,12 5,5 0,-10 Z" fill="url(#goldGrad)" opacity="0.8" />
      <!-- Lotus Base / Seed Pod -->
      <path d="M -8,5 C -5,12 5,12 8,5 Z" fill="url(#goldGrad)" />
    </g>
    
    <!-- Small Decorative Gold Dots -->
    <circle cx="0" cy="-24" r="1.5" fill="url(#goldGrad)" />
    <circle cx="0" cy="24" r="1.5" fill="url(#goldGrad)" />
    <circle cx="-24" cy="0" r="1.5" fill="url(#goldGrad)" />
    <circle cx="24" cy="0" r="1.5" fill="url(#goldGrad)" />
  </g>

  <!-- Right: Premium Typography -->
  <!-- Brand Name -->
  <text x="90" y="32" font-family="'Playfair Display', 'Georgia', serif" font-size="22" font-weight="bold" fill="url(#goldGrad)" letter-spacing="2">MAHALAXMI</text>
  <text x="90" y="52" font-family="'Poppins', 'Arial', sans-serif" font-size="12" font-weight="600" fill="#FFF8EE" letter-spacing="4.5">MITHAIWALA</text>
  
  <!-- Estd / Tagline -->
  <text x="90" y="68" font-family="'Poppins', 'Arial', sans-serif" font-size="8.5" font-weight="500" fill="#D9A441" letter-spacing="1">SINCE 1982</text>
  
  <!-- Small Decorative Divider Line -->
  <line x1="90" y1="58" x2="240" y2="58" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.5" />
</svg>
